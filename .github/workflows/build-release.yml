name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Windows — build staged app + Inno Setup installer
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fix ICO 256×256 entry (for electron-builder compatibility)
        run: node scripts/fix-ico256.mjs

      - name: Build renderer + electron
        run: npm run build

      - name: Stage app folder
        run: npm run stage

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc installer/light.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHUD-Windows-Setup
          path: release/AgentHUD-Setup-*.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # macOS — build .app + pack into .dmg
  # ──────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build + stage + pack DMG
        run: npm run dist:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHUD-macOS
          path: release/AgentHUD-*.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Linux — build staged app + tarball
  # ──────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build + stage + pack tarball
        run: npm run dist:linux

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHUD-Linux
          path: release/AgentHUD-*-linux-*.tar.gz
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Release — collect all artifacts and publish a GitHub Release
  # ──────────────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AgentHUD ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
